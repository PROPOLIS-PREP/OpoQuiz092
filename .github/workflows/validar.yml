name: Validar datos

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar preguntas y datos
        run: node tools/validar.mjs
      - name: Comprobar que index.html está al día con data/
        run: node tools/build.mjs --check
      - name: Tests
        run: node --test tests/*.test.mjs
