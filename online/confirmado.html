<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#061b45">
<title>Cuenta verificada · Patrullan2</title>
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<!-- Página de vuelta del enlace de confirmación de correo (emailRedirectTo en online/cuenta.js).
     Estática: no carga supabase-js ni inicia sesión; el jugador entra después desde «Cuenta online». -->
<style>
:root{--tinta:#09275d;--display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;--cuerpo:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));font-family:var(--cuerpo);font-weight:700;color:#fff;
  background:linear-gradient(180deg,#041c4970 0%,transparent 37%,#041a4660 70%,#041631 100%),
             radial-gradient(ellipse at 50% 22%,#1572c8,#062b68 53%,#041631);background-color:#061b45;background-attachment:fixed}
.tarjeta{width:100%;max-width:420px;text-align:center;padding:28px 20px 24px;
  background:linear-gradient(155deg,#fff8ea,#f5e6d7);color:var(--tinta);border:2px solid #f7bf42;border-radius:20px;
  box-shadow:0 0 0 2px #082957,0 7px 16px #0213348c,inset 0 0 0 2px #fff8e8}
.sello{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(#67ec3b,#10b723 55%,#058513);border:3px solid #ffc840;box-shadow:0 5px 0 #05342b,inset 0 3px 5px #e5ffa5}
.sello svg{width:46px;height:46px}
.error .sello{background:linear-gradient(#ff7d8a,#e0263f 55%,#a5102a);box-shadow:0 5px 0 #4d0614,inset 0 3px 5px #ffc6cc}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,38px);line-height:1.1;margin:0 0 8px;letter-spacing:.01em}
p{font-size:17px;line-height:1.4;margin:0 0 22px;overflow-wrap:anywhere}
.btn{display:inline-block;max-width:100%;font-family:var(--display);font-size:clamp(20px,6vw,26px);letter-spacing:.02em;color:#fff;text-decoration:none;
  padding:12px 28px;border:3px solid #ffc840;border-radius:18px;text-shadow:0 3px 2px #004209;
  background:linear-gradient(#67ec3b,#10b723 43%,#058513 73%,#046a0e);box-shadow:0 5px 0 #05342b,0 8px 14px #05214563,inset 0 0 0 2px #056224,inset 0 3px 5px #e5ffa5}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #05342b}
.btn:focus-visible{outline:3px solid #ffcb2e;outline-offset:3px}
.marca{margin:18px 0 0;font-size:13px;opacity:.75}
</style>
</head>
<body>
<main class="tarjeta" id="tarjeta">
  <div class="sello" aria-hidden="true">
    <svg id="icono" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <h1 id="titulo">Cuenta verificada</h1>
  <p id="texto">Ya puedes volver al juego.</p>
  <a class="btn" href="../index.html">Volver al juego</a>
  <p class="marca">Patrullan2 · PROPOLIS</p>
</main>
<script>
// Si Supabase devuelve un error (enlace caducado o ya usado), no se muestra «verificada».
// Después se quita de la barra de direcciones lo que trae el enlace (tokens o error), para que no quede en el historial.
(function () {
  var datos = (location.hash || "").replace(/^#/, "") + "&" + (location.search || "").replace(/^\?/, "");
  if (/(^|&)(error|error_code|error_description)=/.test(datos)) {
    document.getElementById("tarjeta").className += " error";
    document.getElementById("titulo").textContent = "No se ha podido verificar";
    document.getElementById("texto").textContent = "El enlace no es válido o ha caducado. Vuelve al juego y pide otro correo desde «Cuenta online».";
    document.getElementById("icono").innerHTML = '<path d="M7 7l10 10M17 7L7 17"/>';
    document.title = "Verificación fallida · Patrullan2";
  }
  if (location.hash || location.search) try { history.replaceState(null, "", location.pathname); } catch (e) {}
})();
</script>
</body>
</html>
